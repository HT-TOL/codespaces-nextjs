openapi: 3.1.0
info:
  title: OCODEJS Codespaces Control API
  version: 0.2.0
  description: >
    Hybrid workspace control plane. Firebase ID tokens authenticate callers.
    Workspace records and queue operations require configured PostgreSQL.
    GitHub Codespaces remains hand-off only; no API provisioning is claimed.
servers:
  - url: /api
security:
  - firebaseBearer: []
paths:
  /platform:
    get:
      security: []
      summary: Read implementation and provider capability status
      responses:
        '200':
          description: Safe status with no credential values
  /session:
    get:
      summary: Verify Firebase ID token and return caller identity
      responses:
        '200':
          description: Verified Firebase principal
        '401':
          description: Missing or invalid token
        '503':
          description: Token verification unavailable
  /v1/workspaces:
    get:
      summary: List workspaces where caller is a member
      responses:
        '200':
          description: Caller-visible workspace list
        '401':
          description: Authentication required
        '503':
          description: PostgreSQL unavailable
    post:
      summary: Create a workspace hand-off record
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository]
              properties:
                repository: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
                ref: { type: string, default: main }
                template: { type: string, enum: [nextjs, react-vite, node, python] }
      responses:
        '202':
          description: Owner-scoped hand-off record created; GitHub has not provisioned a workspace
        '409':
          description: Idempotency key reused with a different request
        '503':
          description: PostgreSQL unavailable
  /v1/workspaces/{id}:
    get:
      summary: Read a workspace if caller has membership
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Workspace metadata and caller membership role
        '404':
          description: Workspace not found or caller is not a member
  /v1/workspaces/{id}/members:
    get:
      summary: List workspace members when caller is a member
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Workspace member roles }
        '404': { description: Workspace not found or caller is not a member }
    post:
      summary: Owner assigns editor or viewer role to a Firebase UID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string, minLength: 1, maxLength: 128 }
                role: { type: string, enum: [editor, viewer] }
      responses:
        '200': { description: Member role assigned }
        '404': { description: Workspace not found or caller is not owner }
  /v1/jobs/{id}/cancel:
    post:
      summary: Request cancellation of a caller-owned job
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Cancellation accepted or requested
        '404':
          description: Job not found or not cancellable
components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
