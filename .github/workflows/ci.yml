name: OCODEJS Codespaces CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-public-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: gen-lang-client-0137515073.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: gen-lang-client-0137515073
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder-app-id
